name: Build GameProject release

# Compila o GameProject (criação de jogos 2D e 3D do Project Club, base
# Godot Engine) para Windows e Linux, no formato da aba Apps:
#   - Windows: GameProject-<versão>-win.zip (GameProject.exe na raiz)
#   - Linux:   GameProject.AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      publish:
        description: 'Publicar a release'
        type: boolean
        default: true

env:
  SCONS_FLAGS: target=editor production=yes lto=none debug_symbols=no
  PYTHONIOENCODING: utf8

jobs:
  linux:
    runs-on: ubuntu-22.04 # glibc 2.35: abre no Ubuntu 22.04 e mais novos
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libwayland-bin
          python -m pip install scons==4.8.1
      - name: AccessKit (acessibilidade)
        id: accesskit
        run: |
          if python ./misc/scripts/install_accesskit.py; then echo "on=yes" >> "$GITHUB_OUTPUT"; else echo "on=no" >> "$GITHUB_OUTPUT"; fi
      - name: Compilar
        run: scons platform=linuxbsd $SCONS_FLAGS accesskit=${{ steps.accesskit.outputs.on }} -j4
      - name: Empacotar AppImage
        run: |
          set -e
          BIN=$(ls bin/godot.linuxbsd.editor.x86_64* | head -1)
          test -n "$BIN"
          echo "Bibliotecas exigidas do sistema:"; ldd "$BIN" | awk '{print "  " $1}'
          APPDIR=GameProject.AppDir
          mkdir -p $APPDIR/usr/bin
          cp "$BIN" $APPDIR/usr/bin/gameproject && chmod +x $APPDIR/usr/bin/gameproject
          cp .github/brand/icon-256.png $APPDIR/gameproject.png
          printf '[Desktop Entry]\nType=Application\nName=GameProject\nComment=Criação de jogos 2D e 3D do Project Club\nExec=gameproject %%f\nIcon=gameproject\nCategories=Development;IDE;Game;\nTerminal=false\n' > $APPDIR/gameproject.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/gameproject" "$@"\n' > $APPDIR/AppRun
          chmod +x $APPDIR/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p dist
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $APPDIR dist/GameProject.AppImage
          du -h dist/GameProject.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: gameproject-linux
          path: dist/GameProject.AppImage

  screenshots:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: gameproject-linux
          path: app
      - name: Dependências para rodar e capturar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick openbox libgl1-mesa-dri libglx-mesa0 libegl1 libxi6 libxcursor1 libxinerama1 libxrandr2 libxkbcommon0 libasound2 libpulse0 libfuse2 fonts-noto-core language-pack-pt
      - name: Rodar o GameProject e capturar telas
        run: |
          mkdir -p shots
          rc=0
          bash .github/scripts/screenshots.sh app/GameProject.AppImage shots > shots/run.log 2>&1 || rc=$?
          cat shots/run.log
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameproject-screenshots
          path: shots/
      - name: Guardar capturas no ramo 'capturas'
        if: always()
        run: |
          cd shots
          git init -q -b capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de tela ${{ inputs.version }} (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SCons
        run: python -m pip install scons==4.8.1
      - name: SDKs (Direct3D 12, ANGLE, AccessKit)
        id: sdk
        shell: bash
        run: |
          for s in d3d12_sdk_windows:d3d12 angle:angle accesskit:accesskit; do
            script=${s%%:*}; flag=${s##*:}
            if python ./misc/scripts/install_${script}.py; then echo "$flag=yes" >> "$GITHUB_OUTPUT"; else echo "$flag=no" >> "$GITHUB_OUTPUT"; fi
          done
      - name: Compilar
        shell: bash
        run: scons platform=windows $SCONS_FLAGS d3d12=${{ steps.sdk.outputs.d3d12 }} angle=${{ steps.sdk.outputs.angle }} accesskit=${{ steps.sdk.outputs.accesskit }} -j4
      - name: Empacotar .zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin -Filter "godot.windows.editor.x86_64*.exe" | Where-Object { $_.Name -notlike "*console*" } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem bin; throw "o executável não foi gerado" }
          $con = Get-ChildItem bin -Filter "godot.windows.editor.x86_64*console.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force pkg, dist | Out-Null
          Copy-Item $exe.FullName pkg\GameProject.exe
          if ($con) { Copy-Item $con.FullName pkg\GameProject.console.exe }
          Get-ChildItem bin -Filter *.dll | ForEach-Object { Copy-Item $_.FullName pkg\ }
          Copy-Item LICENSE.txt pkg\LICENSE.txt
          Copy-Item COPYRIGHT.txt pkg\COPYRIGHT.txt
          Get-ChildItem pkg | Select-Object Name, Length
          Compress-Archive -Path "pkg\*" -DestinationPath "dist\GameProject-${{ inputs.version }}-win.zip"
          Get-Item dist\*.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: gameproject-windows
          path: dist/*.zip

  release:
    if: ${{ inputs.publish }}
    needs: [linux, windows, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: GameProject ${{ inputs.version }}
          make_latest: true
          body: |
            GameProject ${{ inputs.version }} — criação de jogos 2D e 3D do Project Club (baseado no Godot Engine, licença MIT).
            - Windows 10/11 (64 bits): GameProject-${{ inputs.version }}-win.zip
            - Linux (x86_64): GameProject.AppImage
            Instale e atualize pela aba **Apps** do Project Club.
          files: |
            dist/gameproject-linux/GameProject.AppImage
            dist/gameproject-windows/*.zip
            dist/gameproject-screenshots/*.png
